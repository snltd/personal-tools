[package]
name = "assay"
# version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
mysql = "28"
regex = "1"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[dev-dependencies]
snltest = { git = "https://github.com/snltd/snltest.git" }
